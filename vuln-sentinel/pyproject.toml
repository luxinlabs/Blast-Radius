[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vuln-sentinel"
version = "0.1.0"
description = "Human-reviewed dependency incident response on Snowflake"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "mcp>=1.26,<2", "packaging>=24", "semantic-version>=2.10,<3", "pydantic>=2.10,<3", "streamlit>=1.42,<2"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.14,<5"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
sentinel = "vuln_sentinel.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
