services:
  api:
    build: .
    env_file: .env
    volumes:
      - state:/app/.sentinel
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  dashboard:
    build: .
    env_file: .env
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "streamlit", "run", "/app/src/vuln_sentinel/dashboard.py", "--server.address", "0.0.0.0", "--browser.gatherUsageStats", "false"]
  worker:
    build: .
    env_file: .env
    environment:
      SENTINEL_TOKEN: ${SENTINEL_ADMIN_TOKEN}
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    command: ["sentinel", "reconcile", "--interval", "3600"]
volumes:
  state:
