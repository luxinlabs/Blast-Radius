name: Validate Vuln Sentinel
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vuln-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints.txt -e '.[dev,snowflake]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python scripts/test.py -q
      - run: python scripts/package_snowflake.py
      - run: git diff --exit-code -- dist/vuln_sentinel.zip
